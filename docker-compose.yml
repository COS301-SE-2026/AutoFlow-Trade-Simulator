services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-harvester:
    build:
      context: ./stock-poller
    container_name: market_data_harvester
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./stock-poller/.env
    volumes:
      - ./stock-poller/storage/raw_harvest:/app/storage/raw_harvest
      - ./stock-poller/config.yaml:/app/config.yaml:ro
    environment:
      - MOCK_MODE=false
      - DATA_LAKE_ROOT=/app/storage/raw_harvest
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: autoflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AUTO_SYNC_DB=false
      - DB_POOL_PRE_PING=true
      - DB_POOL_RECYCLE=1800
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
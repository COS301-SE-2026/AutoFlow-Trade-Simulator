name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    name: Build and Restart Backend Containers
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Environment Configuration
        run: |
          if [ ! -f .env ]; then
            echo "WARNING: .env file not found in $(pwd). Ensure persistent environment variables exist on EC2."
          fi

      - name: Build and Restart Docker Containers
        run: |
          # Rebuild images and start containers in detached mode
          docker compose up -d --build

      - name: Verify Container Health
        run: |
          # Confirm the containers are running
          docker compose ps

      - name: Clean Up Unused Docker Images
        if: always()
        run: |
          # Prune dangling build images to preserve EC2 disk space
          docker image prune -f
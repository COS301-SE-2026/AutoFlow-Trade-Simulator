name: main-pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install root npm dependencies
        run: npm install

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip               # FIXED: removed pip==26.2
          python -m pip install --require-hashes -r backend/requirements.txt
          python -m pip install --require-hashes -r backend/requirements-cov.lock.txt

      - name: Lint backend
        run: npm run lint:backend

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          name: backend
          fail_ci_if_error: false

  stock-poller:
    name: Stock poller tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install stock-poller dependencies
        run: |
          python -m pip install --upgrade pip               # FIXED: removed pip==26.2
          python -m pip install --require-hashes -r stock-poller/requirements-test.lock.txt

      - name: Run stock-poller tests
        run: python -m pytest stock-poller/tests -v --cov=stock-poller --cov-report=xml:coverage-stock-poller.xml

      - name: Upload stock-poller coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-stock-poller.xml
          flags: stock-poller
          name: stock-poller
          fail_ci_if_error: false

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint:frontend

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: frontend
        run: npm run build
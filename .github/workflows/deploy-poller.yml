name: Deploy Stock Poller to AWS Fargate

on:
  push:
    branches:
      - main
    paths:
      - 'stock-poller/**'
      - '.github/workflows/deploy-poller.yml'

# Prevent concurrent deployment collisions
concurrency:
  group: deploy-poller-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 066196453073.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: autoflow-stock-poller
  ECS_CLUSTER: autoflow-cluster
  ECS_SERVICE: stock-poller-service
  TASK_DEF_PATH: stock-poller/task-definition.json
  CONTAINER_NAME: stock-poller

jobs:
  deploy-poller:
    name: Build Native ARM64 & Deploy to Fargate
    # Native ARM64 runner removes the need for QEMU emulation
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        # Pinned to actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials
        # Pinned to aws-actions/configure-aws-credentials@v4.1.0
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        # Pinned to aws-actions/amazon-ecr-login@v2.0.1
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Set up Docker Buildx
        # Pinned to docker/setup-buildx-action@v3.10.0
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      - name: Build and Push ARM64 Image to ECR
        id: build-image
        # Pinned to docker/build-push-action@v6.15.0
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: stock-poller
          file: stock-poller/Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Render Task Definition with New Image Tag
        id: render-task-def
        # Pinned to aws-actions/amazon-ecs-render-task-definition@v1.6.3
        uses: aws-actions/amazon-ecs-render-task-definition@25287f3b89a803be815eb0092c6cc116b3d4f404
        with:
          task-definition: ${{ env.TASK_DEF_PATH }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Task Definition to AWS ECS
        # Pinned to aws-actions/amazon-ecs-deploy-task-definition@v2.3.0
        uses: aws-actions/amazon-ecs-deploy-task-definition@8e4e6f477383a8b418e26bc141d81a95e7c6536b
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
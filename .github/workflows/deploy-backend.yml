name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'appspec.yml'
      - 'scripts/**'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build, Migrate & Trigger Blue/Green Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlmodel psycopg2-binary pydantic-settings

      - name: Execute Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head

      - name: Package CodeDeploy Bundle
        run: |
          mkdir -p build
          zip -r build/deployment-${{ github.sha }}.zip appspec.yml scripts/

      - name: Upload Bundle to Amazon S3
        run: |
          aws s3 cp build/deployment-${{ github.sha }}.zip \
            s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/deployments/deployment-${{ github.sha }}.zip

      - name: Create CodeDeploy Deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_DEPLOYMENT_BUCKET }},key=deployments/deployment-${{ github.sha }}.zip,bundleType=zip \
            --description "Automated deployment for commit ${{ github.sha }}" \
            --query "deploymentId" \
            --output text)
          
          echo "Triggered CodeDeploy Deployment ID: $DEPLOYMENT_ID"
          
          # Block and wait until CodeDeploy lifecycle hooks pass health checks on EC2
          aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID
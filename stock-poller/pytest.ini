[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
python_files = test_*.py
markers =
    layer0: pure helper functions (no async, no I/O)
    layer1: adapter validation/transform logic (pure, no I/O)
    layer2: BaseMarketDataAdapter orchestration (mocked I/O)
    layer3: ingestion worker (mocked DB)
    layer4: db.py persistence layer (mocked asyncpg)
    layer5: main.py wiring / top-level orchestration
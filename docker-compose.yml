services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoflow_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-harvester:
    build:
      context: ./stock-poller
    container_name: market_data_harvester
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./stock-poller/.env
    volumes:
      - ./stock-poller/storage/raw_harvest:/app/storage/raw_harvest
      - ./stock-poller/config.yaml:/app/config.yaml:ro
    environment:
      - MOCK_MODE=false
      - DATA_LAKE_ROOT=/app/storage/raw_harvest
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-autoflow}
      - DB_USER=${POSTGRES_USER:-autoflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-autoflow_password}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: autoflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-autoflow}
      - DB_USER=${POSTGRES_USER:-autoflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-autoflow_password}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
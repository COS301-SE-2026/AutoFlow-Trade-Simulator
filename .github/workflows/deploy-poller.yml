name: Deploy Stock Poller to AWS Fargate

on:
  push:
    branches:
      - main
    paths:
      - 'stock-poller/**'
      - '.github/workflows/deploy-poller.yml'

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 066196453073.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: autoflow-stock-poller
  ECS_CLUSTER: autoflow-cluster
  ECS_SERVICE: stock-poller-service
  TASK_DEF_PATH: stock-poller/task-definition.json
  CONTAINER_NAME: stock-poller

jobs:
  deploy-poller:
    name: Build ARM64 & Deploy to Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ARM64 Image to ECR
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: stock-poller
          file: stock-poller/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Render Task Definition with New Image Tag
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEF_PATH }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Task Definition to AWS ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
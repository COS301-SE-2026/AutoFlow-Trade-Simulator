name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'appspec.yml'
      - 'scripts/**'
permissions:
  id-token: write
  contents: read


concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build, Migrate & Trigger Blue/Green Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log into Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" ./backend
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Set up Python
        uses: actions/setup-python@39cd1495184d9424647063a5b471e12359d26203 # v5.1.1
        with:
          python-version: "3.11"

      - name: Install Migration Dependencies
        run: |
            python -m pip install --upgrade pip==24.0
            pip install --only-binary=:all: \
              alembic==1.13.1 \
              sqlmodel==0.0.16 \
              psycopg2-binary==2.9.9 \
              pydantic-settings==2.2.1

      - name: Execute Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head

      - name: Package CodeDeploy Bundle
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          mkdir -p build
          echo "IMAGE_TAG=${{ github.sha }}" > scripts/image.env
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> scripts/image.env
          echo "ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}" >> scripts/image.env
          echo "AWS_REGION=$AWS_REGION" >> scripts/image.env
          zip -r "build/deployment-${{ github.sha }}.zip" appspec.yml scripts/

      - name: Upload Bundle to Amazon S3
        env:
          S3_DEPLOYMENT_BUCKET: ${{ secrets.S3_DEPLOYMENT_BUCKET }}
        run: |
          aws s3 cp "build/deployment-${GITHUB_SHA}.zip" \
            "s3://${S3_DEPLOYMENT_BUCKET}/deployments/deployment-${GITHUB_SHA}.zip"

      - name: Create CodeDeploy Deployment
        env:
          CODEDEPLOY_APP_NAME: ${{ secrets.CODEDEPLOY_APP_NAME }}
          CODEDEPLOY_GROUP_NAME: ${{ secrets.CODEDEPLOY_GROUP_NAME }}
          S3_DEPLOYMENT_BUCKET: ${{ secrets.S3_DEPLOYMENT_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP_NAME" \
            --deployment-group-name "$CODEDEPLOY_GROUP_NAME" \
            --s3-location bucket="$S3_DEPLOYMENT_BUCKET",key=deployments/deployment-${GITHUB_SHA}.zip,bundleType=zip \
            --description "Automated deployment for commit ${GITHUB_SHA}" \
            --query "deploymentId" \
            --output text)
          
          echo "Triggered CodeDeploy Deployment ID: $DEPLOYMENT_ID"
          
          # Block and wait until CodeDeploy lifecycle hooks pass health checks on EC2
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID" --region "$AWS_REGION"